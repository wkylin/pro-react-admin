packages:
  - .
  - api
  - packages/wui-react

onlyBuiltDependencies:
  - '@sentry/cli'
  - '@tsparticles/engine'
  - core-js
  - core-js-pure
  - electron
  - es5-ext
  - esbuild
  - sharp
  - sonar-scanner
  - unrs-resolver
allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': true
  '@tsparticles/engine': true
  core-js: true
  core-js-pure: true
  electron: true
  es5-ext: true
  esbuild: true
  node-pty: false
  sharp: true
  sonar-scanner: true
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    eslint: '10'

patchedDependencies:
  page-flip@2.0.7: patches/page-flip@2.0.7.patch
