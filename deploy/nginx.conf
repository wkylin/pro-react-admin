server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ ^(?:/.+)?/(?:remoteEntry\.js|remote-manifest\.json|sw\.js|index\.html)$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location ~ /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # A separately deployed API must be proxied here or configured through APP_BASE_URL.
    location /api/ { default_type application/json; return 503 '{"code":503,"message":"API is not configured"}'; }
    location ~ \.[a-zA-Z0-9]+$ { try_files $uri =404; }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
