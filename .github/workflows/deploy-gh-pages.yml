name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build main app
        run: pnpm run build:production
        env:
          NODE_ENV: production
          PUBLIC_URL: /pro-react-admin

      - name: Build Storybook
        run: pnpm run build-storybook
        env:
          NODE_ENV: production
          STORYBOOK_BASE_HREF: /pro-react-admin/storybook/

      - name: Organize existing build artifacts
        run: node scripts/prepare-pages.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist-combined'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output deployment URL
        run: |
          echo "🚀 Deployment successful!"
          echo "📱 Main App: https://wkylin.github.io/pro-react-admin/"
          echo "📚 Storybook: https://wkylin.github.io/pro-react-admin/storybook/"
