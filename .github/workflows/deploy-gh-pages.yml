name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Application set (Storybook is always included)
        required: true
        default: all
        type: choice
        options: [all, default, enterprise, mfe, multi, storybook]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure Pages and infer the actual domain/path
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate component story coverage and types
        run: |
          pnpm run check:stories
          pnpm run typecheck:storybook
      - name: Build selected applications and Storybook
        run: pnpm run build:pages
        env:
          PAGES_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.origin }}
          STORYBOOK_DISABLE_TELEMETRY: '1'
      - name: Verify every component reached the Storybook index
        run: node scripts/validate-stories.mjs --built
      - name: Verify built assets, base paths and federation containers
        run: pnpm run check:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-combined
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record preview links
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
        run: |
          echo "Preview: ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Storybook: ${PAGE_URL}storybook/" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: ${TARGET}; see deployment.json and portal.html for available entries." >> "$GITHUB_STEP_SUMMARY"
